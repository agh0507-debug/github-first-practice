<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 첫 GitHub 웹페이지</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #f5f7ff;
      color: #1f2937;
    }

    main {
      width: min(520px, 85%);
      padding: 48px 32px;
      text-align: center;
      background: white;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(31, 41, 55, 0.12);
    }

    h1 {
      margin-top: 0;
    }

    button {
      margin-top: 16px;
      padding: 12px 20px;
      border: 0;
      border-radius: 999px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="greeting">안녕하세요!</h1>
    <p>GitHub에서 만든 나의 첫 웹 프로그램입니다.</p>
    <button id="changeButton">인사말 바꾸기</button>
  </main>

  <script>
    const greeting = document.querySelector("#greeting");
    const button = document.querySelector("#changeButton");

    button.addEventListener("click", () => {
      greeting.textContent = "첫 프로그램이 작동했어요 🎉";
    });
  </script>
</body>
</html>
